[project]
name = "dbdelay"
version = "0.1.0"
description = "Predict Deutsche Bahn long-distance delays and score them against DB's own forecast."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "Aymen Rahmani" }]
keywords = [
    "deutsche-bahn", "train-delays", "delay-prediction", "forecasting", "lightgbm",
    "quantile-regression", "conformal-prediction", "duckdb", "fastapi", "data-engineering",
]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "httpx>=0.27",
    "lxml>=5.2",
    "tenacity>=8.5",
    "pydantic-settings>=2.4",
    "tzdata>=2024.1",
    "duckdb>=1.1",
]

[project.urls]
Repository = "https://github.com/Aymenrahmanii/DB_Delay_Prediction"

[project.scripts]
dbdelay = "dbdelay.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
    "lxml-stubs>=0.5",
]
analysis = [
    "lightgbm>=4.7.0",
    "polars>=1.9",
    "pyarrow>=17",
]
web = [
    "fastapi>=0.163.1",
    "jinja2>=3.1.6",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dbdelay"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "DTZ", "PTH"]

[tool.ruff.lint.per-file-ignores]
# The GIF texts are typeset: en dashes are meant.
"scripts/*" = ["RUF001"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["duckdb.*", "pyarrow.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
